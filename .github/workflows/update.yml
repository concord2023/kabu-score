name: Update stock scores

on:
  workflow_dispatch:
  schedule:
    - cron: '30 11 * * 1-5'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Update data from IRBANK and market breadth
        env:
          IRBANK_API_KEY: ${{ secrets.IRBANK_API_KEY }}
        run: python scripts/update_data.py

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/stocks.json
          git diff --cached --quiet || git commit -m "Update stock scores"
          git push
