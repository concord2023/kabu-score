name: Scan all listed stocks

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: kabu-score-repo-write
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install company-master dependency
        run: python -m pip install openpyxl
      - name: Refresh listed-company master
        continue-on-error: true
        run: python update_company_master.py
      - name: Scan all listed stocks for BUY candidates
        env:
          IRBANK_API_KEY: ${{ secrets.IRBANK_API_KEY }}
        run: python scan_recommendations.py
      - name: Save BUY candidate scan
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/recommendations.json data/company_master.json
          git diff --cached --quiet || git commit -m 'Update BUY candidate scan'
          git push
