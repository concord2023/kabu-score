name: Realtime quote snapshot

on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 0-7 * * 1-5'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch Yahoo Finance quote snapshot
        run: python realtime_quotes_update.py
      - name: Commit quote snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/realtime_quotes.json
          git diff --cached --quiet || git commit -m "Update realtime quote snapshot"
          git push
