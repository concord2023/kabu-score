name: Scan Prime bottom candidates

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: kabu-score-repo-write
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate release before API calls
        run: python validate_release.py
      - name: Scan Prime bottom candidates
        env:
          IRBANK_API_KEY: ${{ secrets.IRBANK_API_KEY }}
        run: python scan_bottom_prime.py
      - name: Save Prime bottom scan
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/bottom_prime_candidates.json
          git diff --cached --quiet || git commit -m 'Update Prime bottom candidate scan'
          git push
