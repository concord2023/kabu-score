name: Daily stock update
on:
  schedule:
    - cron: '10 22 * * 1-5'
  workflow_dispatch:
    inputs:
      add_stock:
        description: 'Add stock (optional: company name or security code, e.g. ローツェ or 6323).'
        required: false
        type: string
  issues:
    types: [opened]
permissions:
  contents: write
  issues: write
concurrency:
  group: kabu-score-daily
  cancel-in-progress: false
jobs:
  update:
    if: ${{ github.event_name != 'issues' || (github.event.issue.user.login == github.repository_owner && startsWith(github.event.issue.title, '[株スコア追加]')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install company-master dependency
        run: python -m pip install openpyxl
      - name: Refresh listed-company master
        continue-on-error: true
        run: python update_company_master.py
      - name: Validate stock-add issue
        if: ${{ github.event_name == 'issues' }}
        id: issue_request
        run: python add_stock_from_issue.py
      - name: Run daily analysis
        id: daily_analysis
        env:
          IRBANK_API_KEY: ${{ secrets.IRBANK_API_KEY }}
          ADD_STOCK_QUERY: ${{ github.event_name == 'issues' && steps.issue_request.outputs.query || inputs.add_stock }}
        run: python run_daily.py
      - name: Scan all listed stocks for BUY candidates
        id: recommendation_scan
        if: ${{ steps.daily_analysis.outcome == 'success' }}
        continue-on-error: true
        env:
          IRBANK_API_KEY: ${{ secrets.IRBANK_API_KEY }}
        run: python scan_recommendations.py
      - name: Save generated data
        if: ${{ steps.daily_analysis.outcome == 'success' }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add watchlist.json data/custom_watchlist.json data/stocks.json data/decision_ranking.json data/company_master.json
          if [ "${{ steps.recommendation_scan.outcome }}" = "success" ]; then
            git add data/recommendations.json
          fi
          git diff --cached --quiet || git commit -m 'Update daily stock decisions'
          git push
      - name: Close completed stock-add request
        if: ${{ steps.daily_analysis.outcome == 'success' && github.event_name == 'issues' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue close "${{ github.event.issue.number }}" --repo "${{ github.repository }}" --comment "銘柄追加と初回分析が完了しました。この銘柄は今回の更新から分析対象です。"
