name: Daily stock update
on:
  schedule:
    - cron: '10 22 * * 1-5'
  workflow_dispatch:
jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python run_daily.py
        env:
          IRBANK_API_KEY: ${{ secrets.IRBANK_API_KEY }}
      - run: git config user.name 'github-actions[bot]'
      - run: git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
      - run: git add data/stocks.json data/decision_ranking.json
      - run: git diff --cached --quiet || git commit -m 'Update daily stock decisions'
      - run: git push
