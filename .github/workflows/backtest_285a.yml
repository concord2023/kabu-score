name: Backtest 285A
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  backtest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run 285A backtest
        env:
          IRBANK_API_KEY: ${{ secrets.IRBANK_API_KEY }}
        run: python scripts/backtest_285a.py
      - name: Upload backtest results
        uses: actions/upload-artifact@v4
        with:
          name: backtest-285A
          path: backtest_285a_output/
