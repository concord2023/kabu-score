<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#111827"><link rel="manifest" href="./manifest.json"><title>株スコア｜禁断の大底</title><style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;color:#111827;background:#f3f5f7}*{box-sizing:border-box}body{margin:0}.wrap{max-width:1100px;margin:auto;padding:12px}.card{background:#fff;border-radius:18px;padding:15px;margin:10px 0;box-shadow:0 2px 12px #0000000b}h1{font-size:23px;margin:0 0 5px}h2{font-size:17px;margin:0 0 8px}.muted,.note{color:#667085;font-size:11px;line-height:1.55}.nav{display:flex;gap:7px;flex-wrap:wrap;margin-top:12px}.nav a{display:inline-block;text-decoration:none;color:#155eef;background:#eef4ff;padding:8px 11px;border-radius:10px;font-size:12px;font-weight:800}.summary{font-size:20px;font-weight:850;margin:8px 0}.fresh{font-size:11px;padding:8px 10px;background:#f7f8fa;border-radius:10px;margin-top:9px}.table-wrap{overflow-x:auto}.table{width:100%;border-collapse:separate;border-spacing:0 6px;font-size:11px;min-width:980px}.table th{font-size:10px;color:#667085;text-align:left;padding:4px 7px;white-space:nowrap}.table td{background:#f8fafc;padding:9px 7px;vertical-align:top}.table td:first-child{border-radius:10px 0 0 10px}.table td:last-child{border-radius:0 10px 10px 0}.name{font-weight:850;font-size:13px}.sub{font-size:10px;color:#667085;margin-top:2px}.score{display:inline-block;font-weight:900;border-radius:999px;padding:5px 8px;background:#fff0f0;color:#a33}.metric{white-space:nowrap}.reason{max-width:380px;line-height:1.5}.chips{display:flex;gap:5px;flex-wrap:wrap}.chip{display:inline-block;border-radius:999px;padding:4px 7px;background:#eef2f6;font-size:10px;white-space:nowrap}.chip.on{background:#fff0f0;color:#a33;font-weight:800}.error{padding:12px;background:#fff4f2;border-radius:12px;color:#b42318;font-size:12px}.empty{padding:20px;background:#f8fafc;border-radius:12px;text-align:center;color:#667085}.footer{font-size:10px;color:#98a2b3;margin-top:10px;line-height:1.55}
</style></head><body><div class="wrap"><div class="card"><h1>🕳️ 禁断の大底候補</h1><div class="muted">東証プライム限定。これは通常のBUY判定とは別の「底値圏探索」です。深い下落だけでなく、RSI・MA乖離・BB・出来高・月足MACD・信用需給を組み合わせて候補を拾います。</div><div class="nav"><a href="./index.html">📋 今日の一覧</a><a href="./signals.html">🚦 サイン一覧</a><a href="./recommendations.html">⭐ BUY候補</a><a href="./bottom.html">🕳️ 禁断の大底</a></div><div id="date" class="muted" style="margin-top:10px">読み込み中…</div><div id="fresh" class="fresh">読み込み中…</div></div><div class="card"><h2>探索結果</h2><div id="summary" class="summary">読み込み中…</div><div id="note" class="note"></div></div><div class="card"><h2>大底候補</h2><div id="rows" class="table-wrap"></div><div class="footer">「禁断の大底」は買い推奨・勝率予測ではありません。底値圏であるほど下落継続の可能性もあるため、反転確認・決算・需給などを別途確認するための候補リストです。</div></div></div><script>
const esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const pct=v=>v==null?'—':Number(v).toFixed(1)+'%';
const n=v=>v==null?'—':Number(v).toFixed(1);
function render(d){document.getElementById('date').textContent='最終更新: '+(d.updated_at||'—');document.getElementById('fresh').textContent=`Prime ${Number(d.universe_count||0).toLocaleString()}銘柄／スクリーニング候補 ${Number(d.screen_candidate_count||0).toLocaleString()}／詳細 ${Number(d.deep_price_count||0).toLocaleString()}／信用需給取得 ${Number(d.margin_count||0).toLocaleString()}／API ${Number(d.request_count||0).toLocaleString()}件`;
 document.getElementById('summary').textContent=`大底候補 ${Number((d.candidates||[]).length).toLocaleString()}銘柄`;
 document.getElementById('note').textContent=`API安全目標 ${d.request_safety_target||900}件未満・実績 ${d.request_count||0}件。日次更新とは別の手動スキャンです。取得エラー ${Number(d.error_count||0)+Number(d.margin_error_count||0)}件。`;
 const a=d.candidates||[];if(!a.length){document.getElementById('rows').innerHTML='<div class="empty">条件に該当する候補はありません。</div>';return;}
 document.getElementById('rows').innerHTML=`<table class="table"><thead><tr><th>銘柄</th><th>大底Score</th><th>株価</th><th>日足RSI</th><th>週足RSI</th><th>25MA乖離</th><th>75MA乖離</th><th>200MA乖離</th><th>月足MACD</th><th>信用需給</th><th>理由</th></tr></thead><tbody>${a.map(x=>{const m=x.monthly_bottom||{},s=x.supply||{};return `<tr><td><a href="./detail.html?code=${encodeURIComponent(x.code)}" style="text-decoration:none;color:inherit"><div class="name">${esc(x.name)}</div><div class="sub">${esc(x.code)} / Prime / ${esc(x.industry||'—')}</div></a></td><td><span class="score">${Number(x.bottom_score||0)}点</span></td><td class="metric">${esc(x.price??'—')}</td><td class="metric">${n(x.rsi14)}</td><td class="metric">${n(x.rsi14_weekly)}</td><td class="metric">${pct(x.vs25)}</td><td class="metric">${pct(x.vs75)}</td><td class="metric">${pct(x.vs200)}</td><td>${m.active?'<span class="chip on">'+esc(m.state||'大底')+'</span>':'<span class="chip">—</span>'}</td><td>${s.improving?'<span class="chip on">需給改善</span>':s.net_change!=null?'<span class="chip">需給変化 '+Number(s.net_change).toLocaleString()+'</span>':'<span class="chip">—</span>'}</td><td class="reason">${(x.bottom_reasons||[]).map(r=>'<span class="chip">'+esc(r)+'</span>').join(' ')}</td></tr>`}).join('')}</tbody></table>`;
}
fetch('./data/bottom_prime_candidates.json?'+Date.now(),{cache:'no-store'}).then(r=>{if(!r.ok)throw Error('まだ禁断の大底スキャン結果がありません。GitHub Actionsから手動実行してください。');return r.json()}).then(render).catch(e=>{document.getElementById('summary').textContent='データ待ち';document.getElementById('note').innerHTML='<div class="error">'+esc(e.message)+'</div>';});
</script></body></html>
