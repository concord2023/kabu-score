<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#111827"><link rel="manifest" href="./manifest.json"><title>株スコア｜サイン一覧</title><style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;color:#111827;background:#f3f5f7}*{box-sizing:border-box}body{margin:0}.wrap{max-width:1050px;margin:auto;padding:12px}.card{background:#fff;border-radius:18px;padding:15px;margin:10px 0;box-shadow:0 2px 12px #0000000b}h1{font-size:22px;margin:0 0 4px}h2{font-size:16px;margin:0 0 8px}.muted,.note{color:#667085;font-size:12px}.nav{display:flex;gap:7px;flex-wrap:wrap;margin-top:11px}.nav a{text-decoration:none;color:#155eef;background:#eef4ff;padding:8px 11px;border-radius:10px;font-size:12px;font-weight:800}.group{margin-top:14px}.item{display:flex;justify-content:space-between;gap:12px;align-items:center;border-top:1px solid #edf0f2;padding:11px 0}.left{min-width:0}.name{font-weight:850;font-size:13px}.sub{font-size:10px;color:#667085;margin-top:2px}.icons{display:flex;gap:5px;flex-wrap:wrap;justify-content:flex-end}.icon{display:inline-flex;align-items:center;gap:3px;border-radius:999px;padding:5px 7px;background:#eef2f6;font-size:10px;white-space:nowrap}.buy{background:#e8f7ef;color:#087f5b;font-weight:850}.supply{background:#eef4ff;color:#155eef}.bottom{background:#fff3e8;color:#a15c00}.breakout{background:#edf6ff;color:#155eef}.warn{background:#fff1f0;color:#b42318}.rsi{background:#f4f0ff;color:#6b46c1}.bb{background:#fff7ed;color:#9a3412}.link{text-decoration:none;color:inherit}.empty{padding:14px;background:#f8fafc;border-radius:10px;color:#667085;font-size:12px}.footer{font-size:10px;color:#98a2b3;line-height:1.5;margin-top:10px}@media(max-width:650px){.item{align-items:flex-start;flex-direction:column}.icons{justify-content:flex-start}}
.quote{display:flex;align-items:baseline;gap:8px;margin-top:4px}.quote-price{font-size:13px;font-weight:900}.quote-change{font-size:11px;font-weight:850;display:inline-block}.quote-change.pos{color:#087f5b}.quote-change.neg{color:#b42318}.quote-change.zero{color:#667085}.quote-change.strong{font-weight:950}.quote-change.extreme{font-weight:950;padding:2px 6px;border-radius:6px;color:#fff}.quote-change.extreme.pos{background:#087f5b}.quote-change.extreme.neg{background:#b42318}
</style></head><body><div class="wrap"><div class="card"><h1>🚦 サイン一覧</h1><div class="muted">総合BUYとは別に、単独で点灯している材料を一覧化。全部の条件が揃っていなくても「何が起きているか」を把握できます。</div><div class="nav"><a href="./index.html">📋 今日の一覧</a><a href="./signals.html">🚦 サイン一覧</a></div><div id="date" class="muted" style="margin-top:10px">読み込み中…</div></div><div id="content"></div></div><script>
const esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const fmtPrice=v=>{if(v==null||v==='')return '—';const n=Number(v);return Number.isFinite(n)?n.toLocaleString('ja-JP',{maximumFractionDigits:2}):String(v)};
const changeClass=v=>{const n=Number(v);if(!Number.isFinite(n))return 'zero';const sign=n>0?'pos':n<0?'neg':'zero';const mag=Math.abs(n);return sign+(mag>=10?' extreme':mag>=3?' strong':'');};
function iconClass(code){return code==='SUPPLY_BUY'||code==='SUPPLY_IMPROVING'?'supply':code==='BOTTOM_VOLUME'||code==='BOTTOM_REVERSAL'?'bottom':code.startsWith('RANGE_')?'breakout':code.startsWith('RSI_')?'rsi':code.startsWith('BB_')?'bb':code==='MONTHLY_MACD_BOTTOM'?'bottom':code==='EXTENDED'?'warn':''}
function build(items,title){const filtered=items.filter(x=>(x.signal_icons||[]).length || x.signal==='BUY_CANDIDATE');if(!filtered.length)return `<div class="card"><h2>${title}</h2><div class="empty">現在点灯している銘柄はありません。</div></div>`;return `<div class="card group"><h2>${title}</h2>${filtered.map(x=>{const arr=(x.signal_icons||[]).slice();if(x.signal==='BUY_CANDIDATE')arr.unshift({code:'AGG_BUY',icon:'🟢',label:'総合BUY'});return `<a class="link" href="./detail.html?code=${encodeURIComponent(x.code)}"><div class="item"><div class="left"><div class="name">${esc(x.name||x.code)}</div><div class="sub">${esc(x.code)}　${esc(x.regime||'')}</div><div class="quote"><span class="quote-price">${fmtPrice(x.details&&x.details.price)}</span><span class="quote-change ${changeClass(x.details&&x.details.change)}">前日比 ${x.details&&x.details.change!=null?Number(x.details.change).toFixed(2)+'%':'—'}</span></div></div><div class="icons">${arr.map(i=>`<span class="icon ${i.code==='AGG_BUY'?'buy':iconClass(i.code)}">${esc(i.icon)} ${esc(i.label)}</span>`).join('')}</div></div></a>`}).join('')}</div>`}
function render(d){document.getElementById('date').textContent='最終更新: '+(d.updated_at||'—');const a=d.ranking||[];document.getElementById('content').innerHTML=build(a,'点灯中のサイン')+'<div class="card"><h2>サインの意味</h2><div class="note">🟢 総合BUY＝セットアップ固有の条件が揃った買い候補。　📦 需給買い＝ネット信用残が改善し、信用倍率も買い側に有利な水準。　📦 需給改善＝ネット信用残は改善しているが、倍率はまだ買いサイン水準ではない。　🔵/🔴 RSI＝日足・週足の30割れ/70超え。　〽️ BB±2σ＝日足25日・週足13週の終値が±2σの外側に出たサイン。　💥 大底出来高＝底値圏で出来高増。　🕯️ 大底反転＝大きな下落後の反転ローソク足。　📈 レンジブレイク＝レンジ上限突破＋出来高などを確認。　⚠️ 過熱警戒＝20日MAから大きく上方。</div><div class="footer">独立サインは「買い推奨」ではありません。点灯理由を詳細ページで確認し、必要なら自分で追加調査できるようにするための表示です。</div></div>'}
fetch('./data/decision_ranking.json?'+Date.now()).then(r=>{if(!r.ok)throw Error('日次ランキングがありません');return r.json()}).then(render).catch(e=>{document.getElementById('content').innerHTML='<div class="card"><div class="empty">'+esc(e.message)+'</div></div>'});
</script></body></html>
