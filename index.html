<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#111827"><link rel="manifest" href="manifest.json"><title>株式スコア</title><style>body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f3f4f6;margin:0;color:#111827}header{background:#111827;color:#fff;padding:20px 18px}.wrap{max-width:720px;margin:auto;padding:16px}h1{margin:0;font-size:22px}.card{background:#fff;border-radius:16px;padding:16px;margin:12px 0;box-shadow:0 2px 10px #0001}.row{display:flex;justify-content:space-between;align-items:center;gap:12px}.muted{color:#6b7280;font-size:13px}.score{font-size:44px;font-weight:800}.pill{padding:7px 11px;border-radius:999px;background:#dcfce7;color:#166534;font-weight:700}input,button{font-size:16px;padding:12px;border-radius:10px;border:1px solid #d1d5db}button{background:#111827;color:#fff;border:0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.metric{background:#f9fafb;padding:12px;border-radius:12px}.bar{height:10px;background:#e5e7eb;border-radius:9px;overflow:hidden}.fill{height:100%;background:#16a34a}.warn{background:#fff7ed;color:#9a3412;padding:12px;border-radius:12px}</style></head><body><header><div class="wrap"><h1>📈 株式スコア</h1><div style="color:#d1d5db">日本株・買いシグナル分析</div></div></header><main class="wrap"><div class="card"><div class="row"><input id="code" value="285A" placeholder="銘柄コード"><button onclick="loadStock()">分析</button></div></div><div id="app"></div></main><script>
let data={};
function status(s){return s>=75?'強い買い候補':s>=65?'買い候補':s>=50?'監視':'見送り'}
function metric(a,b){return `<div class="metric"><div class="muted">${a}</div><b style="font-size:20px">${b}</b></div>`}
async function init(){try{let r=await fetch('data/stocks.json?'+Date.now());data=(await r.json()).stocks||{};loadStock()}catch(e){document.getElementById('app').innerHTML='<div class="card">データを読み込めませんでした。</div>'}}
function loadStock(){let code=document.getElementById('code').value.trim().toUpperCase();let d=data[code];if(!d){document.getElementById('app').innerHTML='<div class="card"><b>この銘柄はまだ登録されていません。</b><p class="muted">watchlist.json に銘柄コードを追加すると、毎日自動更新できます。</p></div>';return}document.getElementById('app').innerHTML=`<div class="card"><div class="row"><div><b>${d.name}</b><div class="muted">${code} ・ ${d.date}</div></div><span class="pill">${status(d.score)}</span></div><div class="row" style="margin-top:18px"><div><div class="score">${d.score}</div><div class="muted">暫定スコア / 100</div></div><div style="text-align:right"><b>${Number(d.price).toLocaleString()}円</b><br><span style="color:#dc2626">${d.change}%</span></div></div><div class="bar"><div class="fill" style="width:${d.score}%"></div></div></div><div class="card"><h3>実データ</h3><div class="grid">${metric('出来高 / 20日平均',d.volume_ratio+'倍')}${metric('20日平均比',d.vs20+'%')}${metric('本日騰落率',d.change+'%')}${metric('更新日',d.date)}</div></div><div class="card"><div class="warn"><b>現在は第1段階です</b><br>株価・出来高はIRBANKから自動取得しています。市場全体の騰落レシオは、データ源を統一してからスコアに組み込みます。</div></div><div class="card"><div class="muted">データ提供：IRBANK。第三者への表示時はIRBANKの出典・利用条件に従います。</div></div>`}
init();
</script></body></html>
