<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#111827"><link rel="manifest" href="manifest.json"><title>株スコア</title><style>body{font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans",sans-serif;margin:0;background:#f3f4f6;color:#111827}.wrap{max-width:760px;margin:auto;padding:18px}.card{background:white;border-radius:18px;padding:18px;margin:12px 0;box-shadow:0 2px 10px #00000010}.score{font-size:54px;font-weight:800;margin:8px 0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.item{background:#f9fafb;border-radius:12px;padding:10px}.label{font-size:12px;color:#6b7280}.value{font-size:18px;font-weight:700;margin-top:3px}.bar{height:10px;background:#e5e7eb;border-radius:99px;overflow:hidden}.fill{height:100%;background:#111827}.warn{background:#fff7ed;border:1px solid #fed7aa;border-radius:12px;padding:10px;font-size:13px}.muted{color:#6b7280;font-size:13px}select{font:inherit;padding:9px;border-radius:10px;border:1px solid #d1d5db;width:100%}</style></head><body><div class="wrap"><h1>📈 株スコア</h1><div class="muted">0〜100の買い場候補スコア（現在は株価系75点＋市場データ準備中）</div><div class="card"><select id="code"></select></div><div id="app"></div><div class="card muted">株価データ: IRBANK API。出典・利用条件に従って表示しています。</div></div><script>
async function load(){
 const d=await fetch('data/stocks.json?ts='+Date.now(),{cache:'no-store'}).then(r=>r.json());
 const sel=document.getElementById('code'); const codes=Object.keys(d.stocks||{}); sel.innerHTML=codes.map(c=>`<option value="${c}">${c}</option>`).join('');
 const v=(x,s='')=>x===null||x===undefined?'—':x+s;
 function render(){const s=d.stocks[sel.value]; if(!s||s.error){document.getElementById('app').innerHTML=`<div class="card warn">データ取得エラー<br>${s?.error||''}</div>`;return}
 const bd=s.score_breakdown||{},b=s.breadth||{};
 document.getElementById('app').innerHTML=`<div class="card"><b>${s.name}</b> (${s.code})<div class="score">${v(s.score)}<span style="font-size:22px"> / ${v(s.score_max, '')}</span></div><div class="bar"><div class="fill" style="width:${Math.min(100,(s.score||0))}%"></div></div><p>${v(s.date)}　終値 ${s.price!=null?Number(s.price).toLocaleString():'—'}円　前日 ${v(s.change,'%')}</p></div>
 <div class="card"><h3>株価指標</h3><div class="grid"><div class="item"><div class="label">RSI14</div><div class="value">${v(s.rsi14)}</div></div><div class="item"><div class="label">出来高 / 20日平均</div><div class="value">${v(s.volume_ratio,'倍')}</div></div><div class="item"><div class="label">20日線乖離</div><div class="value">${v(s.vs20,'%')}</div></div><div class="item"><div class="label">60日線乖離</div><div class="value">${v(s.vs60,'%')}</div></div><div class="item"><div class="label">5日リターン</div><div class="value">${v(s.ret5,'%')}</div></div><div class="item"><div class="label">10日リターン</div><div class="value">${v(s.ret10,'%')}</div></div></div></div>
 <div class="card"><h3>市場環境</h3><div class="grid"><div class="item"><div class="label">騰落6日</div><div class="value">${v(b['6d'])}</div></div><div class="item"><div class="label">騰落10日</div><div class="value">${v(b['10d'])}</div></div><div class="item"><div class="label">騰落15日</div><div class="value">${v(b['15d'])}</div></div><div class="item"><div class="label">騰落25日</div><div class="value">${v(b['25d'])}</div></div></div><p>日経225: ${v(s.nikkei_change,'%')}<br>銘柄 vs 日経: ${v(s.relative_strength,'pt')}</p><div class="warn">市場データはまだ接続前です。未取得の値を推測していません。</div></div>
 <div class="card"><h3>診断</h3><div class="grid"><div class="item"><div class="label">取得行数</div><div class="value">${v(s.rows_received,'件')}</div></div><div class="item"><div class="label">計算可能データ</div><div class="value">${v(s.data_points,'件')}</div></div><div class="item"><div class="label">RSI計算</div><div class="value">${s.diagnostic?.rsi_ready?'OK':'不足'}</div></div><div class="item"><div class="label">60日線計算</div><div class="value">${s.diagnostic?.ma60_ready?'OK':'不足'}</div></div></div></div>
 <div class="card"><h3>スコア内訳</h3><div class="grid">${Object.entries(bd).map(([k,x])=>`<div class="item"><div class="label">${k}</div><div class="value">+${x}</div></div>`).join('')}</div></div>
 <div class="card muted">更新: ${v(d.updated_at)}</div>`}
 sel.onchange=render; if(codes.length) render(); else document.getElementById('app').innerHTML='<div class="card warn">銘柄データがありません。</div>';
}
load().catch(e=>document.getElementById('app').innerHTML='<div class="card warn">data/stocks.json の読み込みに失敗しました。</div>');
</script></body></html>
