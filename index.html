<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#111827"><link rel="manifest" href="manifest.json"><title>株スコア</title><style>body{font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans",sans-serif;margin:0;background:#f3f4f6;color:#111827}.wrap{max-width:760px;margin:auto;padding:18px}.card{background:white;border-radius:18px;padding:18px;margin:12px 0;box-shadow:0 2px 10px #00000010}h1{margin:0 0 6px}.muted{color:#6b7280;font-size:13px}.score{font-size:54px;font-weight:800;margin:8px 0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.item{background:#f9fafb;border-radius:12px;padding:10px}.label{font-size:12px;color:#6b7280}.value{font-size:18px;font-weight:700;margin-top:3px}.bar{height:10px;background:#e5e7eb;border-radius:99px;overflow:hidden}.fill{height:100%;background:#111827}.warn{background:#fff7ed;border:1px solid #fed7aa;border-radius:12px;padding:10px;font-size:13px}.good{background:#ecfdf5;border:1px solid #a7f3d0;border-radius:12px;padding:10px;font-size:13px}button{font:inherit;border:0;border-radius:10px;padding:10px 14px;background:#111827;color:#fff}select{font:inherit;padding:9px;border-radius:10px;border:1px solid #d1d5db;width:100%}</style></head><body><div class="wrap"><h1>📈 株スコア</h1><div class="muted">日本株の「買い場候補」を0〜100で表示</div><div class="card"><select id="code"></select></div><div id="app"></div><div class="card muted">株価データ: IRBANK API。市場データ: 何でも定点観測。データ提供条件・出典を確認のうえ、個人分析用途で利用してください。</div></div><script>
async function load(){const d=await fetch('data/stocks.json?'+Date.now()).then(r=>r.json());const sel=document.getElementById('code');const codes=Object.keys(d.stocks);sel.innerHTML=codes.map(c=>`<option>${c}</option>`).join('');function render(){const s=d.stocks[sel.value];if(!s||s.error){document.getElementById('app').innerHTML='<div class="card warn">データ取得エラー</div>';return}const b=s.breadth||{};const bd=s.score_breakdown||{};const market=s.nikkei_change!=null?`日経225 ${s.nikkei_change.toFixed(2)}%`:'日経225データなし';document.getElementById('app').innerHTML=`<div class="card"><div><b>${s.name}</b> (${s.code})</div><div class="score">${s.score}<span style="font-size:22px"> / 100</span></div><div class="bar"><div class="fill" style="width:${s.score}%"></div></div><p>${s.date} 終値 ${Number(s.price).toLocaleString()}円 / 前日 ${s.change.toFixed(2)}%</p>${s.score>=70?'<div class="good">高スコア。複数条件が重なっています。ただし、スコアは投資判断そのものではありません。</div>':''}</div><div class="card"><h3>主な指標</h3><div class="grid"><div class="item"><div class="label">RSI14</div><div class="value">${s.rsi14??'—'}</div></div><div class="item"><div class="label">出来高 / 20日平均</div><div class="value">${s.volume_ratio??'—'}倍</div></div><div class="item"><div class="label">20日線乖離</div><div class="value">${s.vs20?.toFixed(2)??'—'}%</div></div><div class="item"><div class="label">60日線乖離</div><div class="value">${s.vs60?.toFixed(2)??'—'}%</div></div><div class="item"><div class="label">5日リターン</div><div class="value">${s.ret5?.toFixed(2)??'—'}%</div></div><div class="item"><div class="label">10日リターン</div><div class="value">${s.ret10?.toFixed(2)??'—'}%</div></div></div></div><div class="card"><h3>市場環境</h3><div class="grid"><div class="item"><div class="label">騰落レシオ 6日</div><div class="value">${b['6d']??'—'}</div></div><div class="item"><div class="label">10日</div><div class="value">${b['10d']??'—'}</div></div><div class="item"><div class="label">15日</div><div class="value">${b['15d']??'—'}</div></div><div class="item"><div class="label">25日</div><div class="value">${b['25d']??'—'}</div></div></div><p>${market}<br>銘柄 vs 日経 = ${s.relative_strength!=null?s.relative_strength.toFixed(2)+'pt':'—'}</p></div><div class="card"><h3>スコア内訳</h3><div class="grid">${Object.entries(bd).map(([k,v])=>`<div class="item"><div class="label">${k}</div><div class="value">+${v}</div></div>`).join('')}</div></div>`}sel.onchange=render;render()}load().catch(e=>document.getElementById('app').innerHTML='<div class="card warn">data/stocks.json を読み込めません。GitHub Pagesの公開を確認してください。</div>');
</script></body></html>
