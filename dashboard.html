<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>株判定 V2</title><link rel="manifest" href="./manifest.json"><meta name="theme-color" content="#111111"><style>body{font-family:-apple-system,BlinkMacSystemFont,sans-serif;background:#f5f6f8;margin:0;color:#111}.wrap{max-width:900px;margin:auto;padding:16px}.card{background:#fff;border-radius:16px;padding:16px;margin:10px 0;box-shadow:0 1px 6px #0001}h1{font-size:22px}table{width:100%;border-collapse:collapse}th,td{padding:9px 6px;border-bottom:1px solid #eee;text-align:left;font-size:13px}.buy{font-weight:700}.muted{color:#666}.pill{padding:4px 8px;border-radius:999px;background:#eee}.top{display:flex;justify-content:space-between;gap:10px;align-items:center}</style></head><body><div class="wrap"><div class="card"><div class="top"><h1>株判定 V2</h1><span id="date" class="muted"></span></div><div id="market" class="muted">市場環境を読み込み中…</div></div><div class="card"><h2>今日の判定</h2><div id="summary"></div><table><thead><tr><th>銘柄</th><th>状態</th><th>判定</th><th>相対強度</th></tr></thead><tbody id="rows"></tbody></table></div></div><script>const jp={UPTREND:'🟢 上昇トレンド',UPTREND_PULLBACK:'🟡 上昇・押し目',DOWNTREND_REVERSAL_WAIT:'🟠 下降・反転待ち',DOWNTREND_CONTINUED:'🔴 下降継続',RANGE_TRANSITION:'🟣 レンジ・転換',UNKNOWN:'⚪ 判定不能'};const sg={BUY_CANDIDATE:'BUY候補',WATCH:'WATCH',AVOID:'AVOID',INSUFFICIENT:'データ不足'};fetch('data/decision_ranking.json?'+Date.now()).then(r=>r.json()).then(d=>{document.getElementById('date').textContent=d.updated_at||'';let n=d.market_context?.nikkei_change;document.getElementById('market').textContent=n==null?'市場データなし':`日経平均日次変化: ${Number(n).toFixed(2)}%（市場は参考情報。買い禁止条件ではありません）`;let a=d.stocks||[];let buy=a.filter(x=>x.signal==='BUY_CANDIDATE').length;document.getElementById('summary').textContent=buy?`今日のBUY候補: ${buy}銘柄`:'今日は確定BUY候補なし';document.getElementById('rows').innerHTML=a.map(x=>`<tr><td><b>${x.name||x.code}</b><br><span class="muted">${x.code}</span></td><td>${jp[x.signal_state]||x.signal_state||''}</td><td class="${x.signal==='BUY_CANDIDATE'?'buy':''}">${sg[x.signal]||x.signal||''}<br><span class="muted">${x.one_condition_away?'あと1条件':''}</span></td><td>${x.relative_strength==null?'—':Number(x.relative_strength).toFixed(2)+'pt'}</td></tr>`).join('')}).catch(e=>{document.getElementById('summary').textContent='データを読み込めませんでした'}); if('serviceWorker' in navigator) navigator.serviceWorker.register('./sw.js').catch(()=>{});</script></body></html>
