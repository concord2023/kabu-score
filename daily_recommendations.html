<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>株スコア｜今日の注目5選</title><style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;color:#111827;background:#f3f5f7}*{box-sizing:border-box}body{margin:0}.wrap{max-width:900px;margin:auto;padding:10px}.card{background:#fff;border-radius:18px;padding:15px;margin:9px 0;box-shadow:0 2px 12px #0000000b}h1{font-size:23px;margin:0 0 5px}.muted{font-size:12px;color:#667085;line-height:1.6}.nav{display:flex;gap:7px;flex-wrap:wrap;margin-top:11px}.nav a{color:#155eef;background:#eef4ff;text-decoration:none;padding:8px 10px;border-radius:10px;font-size:11px;font-weight:800}.fresh{margin-top:9px;padding:8px 10px;background:#f7f8fa;border-radius:10px;font-size:11px}.pick{border:1px solid #e1e6ed;border-radius:15px;padding:13px;margin:9px 0;background:#fbfcfd}.head{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}.rank{font-size:18px;font-weight:950}.name{font-size:16px;font-weight:900}.code{font-size:11px;color:#667085}.score{font-size:11px;color:#667085}.reason{margin-top:7px;line-height:1.55;font-size:12px}.why{margin-top:8px;padding:9px 10px;background:#f7f9fc;border-left:3px solid #155eef;border-radius:8px;font-size:11px;line-height:1.55}.what{margin-top:7px;font-size:11px;line-height:1.55}.risk{margin-top:7px;font-size:11px;color:#a15c00}.chips{display:flex;gap:5px;flex-wrap:wrap;margin-top:8px}.chip{padding:4px 7px;border-radius:999px;background:#eef2f6;font-size:10px}.src{margin-top:8px;padding-top:8px;border-top:1px solid #edf0f3}.src a{color:#155eef;text-decoration:none;font-size:11px;line-height:1.5}.kpi{margin-top:7px;font-size:11px;color:#475467}.warn{background:#fff4ed;color:#a15c00;padding:9px;border-radius:10px;font-size:11px}.footer{font-size:10px;color:#98a2b3;line-height:1.6}.error{background:#fff1f0;color:#b42318;padding:10px;border-radius:10px;font-size:11px}
</style></head><body><div class="wrap"><div class="card"><h1>🔥 今日の注目5選</h1><div class="muted">その日に日本の投資家・ニュース・アナリスト・YouTube等で発信が集中した銘柄を集約。<strong>「注目された」ことと「買い」判定は分離</strong>して表示します。</div><div class="nav"><a href="./index.html">📋 今日の一覧</a><a href="./signals.html">🚦 サイン一覧</a><a href="./recommendations.html">⭐ BUY候補</a><a href="./daily_recommendations.html">🔥 今日の注目5選</a></div><div id="fresh" class="fresh">読み込み中…</div></div><div id="body"></div><div class="card"><div class="footer">注目度は、同日情報の件数・情報源の種類・投資家話題順位などを使ったアプリ内の集計値です。投資判断そのものを示すスコアではありません。各情報は発信元の見解であり、内容の正確性・将来の株価を保証するものではありません。</div></div></div><script>
const esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const pct=v=>v==null||!Number.isFinite(Number(v))?'—':(Number(v)>=0?'+':'')+Number(v).toFixed(2)+'%';
function render(d){document.getElementById('fresh').textContent=`${d.date||'—'} ／ 最終更新 ${d.updated_at||'—'} ／ ${d.candidates?.length||0}銘柄`;
 if(d.errors?.length) document.getElementById('body').innerHTML='<div class="card"><div class="warn">一部の外部情報源を取得できませんでした。取得できた情報だけで表示しています。</div></div>';
 const a=d.candidates||[]; if(!a.length){document.getElementById('body').innerHTML+='<div class="card"><div class="muted">本日の注目情報を取得できませんでした。次回の日次更新で再取得します。</div></div>';return;}
 document.getElementById('body').innerHTML+=a.map((x,i)=>{const m=x.research_memo||{};return `<div class="card pick"><details><summary style="cursor:pointer;list-style:none"><div class="head"><div><span class="rank">${i+1}.</span> <span class="name">${esc(x.name)}</span> <span class="code">${esc(x.code)}</span><div class="reason"><strong>${esc(x.movement_type||'話題集中')}</strong></div></div><div class="score">注目度 ${Number(x.score||0).toFixed(1)}</div></div></summary><div class="why"><strong>調査メモ</strong><br>${esc(m.summary||x.reason||'当日の外部情報で話題化')}<br><br><strong>なぜ選定？</strong> ${esc(m.why||x.explanation?.why_selected||'当日の話題化')}<br><strong>材料分類：</strong>${esc(m.category||x.explanation?.material_category||'投資家の話題・材料')}<br><strong>確認ポイント：</strong>${esc(m.check_point||'情報源本文で確認してください。')}</div><div class="what"><strong>収集した情報の要約</strong><br>${esc(m.detail||x.explanation?.what_is_happening||x.material_summary||'—')}</div><div class="kpi"><strong>集計：</strong>情報源 ${esc(m.source_count??x.source_types?.length??0)}種類・同日言及 ${esc(m.mention_count??x.sources?.length??0)}件${x.explanation?.score_breakdown?.investor_rank?`・投資家話題 ${esc(x.explanation.score_breakdown.investor_rank)}位`:''}</div><div class="chips"><span class="chip">情報源 ${x.source_types?.length||0}種類</span>${x.kabu_score!=null?`<span class="chip">kabu-score ${esc(x.kabu_score)}</span>`:''}${x.signal?`<span class="chip">判定 ${esc(x.signal)}</span>`:''}${x.rsi14!=null?`<span class="chip">RSI ${Number(x.rsi14).toFixed(1)}</span>`:''}${x.change!=null?`<span class="chip">前日比 ${pct(x.change)}</span>`:''}</div><div class="src">${(x.sources||[]).map(v=>`<div><a href="${esc(v.url)}" target="_blank" rel="noopener">${esc(v.name)}：${esc(v.title)}</a></div>`).join('')}</div></details></div>`}).join('');}
fetch('./data/daily_recommendations.json?'+Date.now()).then(r=>{if(!r.ok)throw Error('今日の注目データがまだありません。Daily stock update後に再表示してください。');return r.json()}).then(render).catch(e=>{document.getElementById('body').innerHTML='<div class="card"><div class="error">'+esc(e.message)+'</div></div>';});
</script></body></html>
