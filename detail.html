function rsiMetric(label,v){return `<div class="metric"><span>${label}</span><b><span class="rsi-value ${rsiClass(v)}">${v==null?'—':Number(v).toFixed(1)}</span></b></div>`;}

function chart(x,timeframe='daily'){
  const datasets={daily:x.details?.chart_history||[],weekly:x.details?.chart_history_weekly||[],monthly:x.details?.chart_history_monthly||[]};

  const labels={daily:'日足',weekly:'週足',monthly:'月足'};

  if(h.length<10)return `<div class="chartbox"><div class="charttabs">${tabs}</div><div class="charttitle">📊 ${labels[timeframe]}テクニカルチャート</div><div class="mini">${labels[timeframe]}データがまだ${h.length}本です。日次更新が正常終了した後に再表示してください。</div></div>`;

  const volTop=top+mainH+gap, rsiTop=volTop+volH+gap, macdTop=rsiTop+rsiH+gap, H=macdTop+macdH+32;
  const points=h.map((r,i)=>({...r,x:left+i/(h.length-1)*(w-left-right)}));
  const maDefs=timeframe==='weekly'?[['ma5','5週MA'],['ma13','13週MA'],['ma26','26週MA'],['ma52','52週MA']]:timeframe==='monthly'?[['ma6','6か月MA'],['ma12','12か月MA'],['ma18','18か月MA']]:[['ma5','5日MA'],['ma25','25日MA'],['ma75','75日MA'],['ma200','200日MA']];
  const priceVals=h.flatMap(r=>[r.high,r.low,...maDefs.map(([k])=>r[k]),r.bb25_upper,r.bb25_lower].map(Number).filter(v=>Number.isFinite(v)));
  if(!priceVals.length)return `<div class="chartbox"><div class="charttabs">${tabs}</div><div class="mini">価格データがありません。</div></div>`;
  const lo=Math.min(...priceVals),hi=Math.max(...priceVals),span=(hi-lo)||1;
  const niceStep=raw=>{const p=Math.pow(10,Math.floor(Math.log10(raw||1))),n=raw/p;return (n<=1?1:n<=2?2:n<=5?5:10)*p};
  const step=niceStep(span/5),axisMin=Math.floor(lo/step)*step,axisMax=Math.ceil(hi/step)*step;
  const yy=v=>top+(1-(v-axisMin)/((axisMax-axisMin)||1))*(mainH);
  const fmtPrice=v=>Number.isInteger(v)?String(v):v.toFixed(1);
  const maPath=key=>points.filter(r=>Number.isFinite(Number(r[key]))).map((r,i)=>(i?'L':'M')+r.x.toFixed(1)+' '+yy(Number(r[key])).toFixed(1)).join(' ');
  const maPaths=maDefs.map(([k])=>({key:k,label:maDefs.find(v=>v[0]===k)[1],path:maPath(k)})); const bbup=maPath('bb25_upper'),bblow=maPath('bb25_lower');
  const bodyW=Math.max(2,Math.min(8,(w-left-right)/h.length*0.62));
  const candles=points.map(r=>{const o=Number(r.open),hi0=Number(r.high),lo0=Number(r.low),c=Number(r.close);if(![o,hi0,lo0,c].every(Number.isFinite))return '';const up=c>=o,topBody=yy(Math.max(o,c)),botBody=yy(Math.min(o,c)),bodyH=Math.max(1,botBody-topBody),cls=up?'up':'down';return `<line x1="${r.x.toFixed(1)}" y1="${yy(hi0).toFixed(1)}" x2="${r.x.toFixed(1)}" y2="${yy(lo0).toFixed(1)}" class="wick ${cls}"/><rect x="${(r.x-bodyW/2).toFixed(1)}" y="${topBody.toFixed(1)}" width="${bodyW.toFixed(1)}" height="${bodyH.toFixed(1)}" class="body ${cls}"/>`}).join('');
  const ticks=[];for(let v=axisMin;v<=axisMax+step*0.01;v+=step)ticks.push(v);
  const grid=ticks.map(v=>`<line x1="${left}" y1="${yy(v).toFixed(1)}" x2="${w-right}" y2="${yy(v).toFixed(1)}" class="gridline"/><text x="${left-7}" y="${(yy(v)+3.5).toFixed(1)}" class="axisprice" text-anchor="end">${esc(fmtPrice(v))}</text>`).join('');
  const maxVol=Math.max(...h.map(r=>Number(r.volume)||0),1);
  const volumeBars=points.map(r=>{const v=Number(r.volume);if(!Number.isFinite(v))return '';const bh=(v/maxVol)*(volH-18), up=Number(r.close)>=Number(r.open);return `<rect x="${(r.x-bodyW/2).toFixed(1)}" y="${(volTop+volH-bh).toFixed(1)}" width="${bodyW.toFixed(1)}" height="${Math.max(1,bh).toFixed(1)}" class="vol ${up?'volup':'voldown'}"/>`}).join('');
  const volumeMa=points.filter(r=>Number.isFinite(Number(r.volume_ma20))).map((r,i)=>{const v=Math.min(Number(r.volume_ma20),maxVol);return (i?'L':'M')+r.x.toFixed(1)+' '+(volTop+volH-(v/maxVol)*(volH-18)).toFixed(1)}).join(' ');
  const rsiY=v=>rsiTop+(1-Math.max(0,Math.min(100,v))/100)*rsiH;
  const rsiPath=points.filter(r=>Number.isFinite(Number(r.rsi14))).map((r,i)=>(i?'L':'M')+r.x.toFixed(1)+' '+rsiY(Number(r.rsi14)).toFixed(1)).join(' ');

  const histBars=points.map(r=>{const v=Number(r.macd_hist);if(!Number.isFinite(v))return '';const zero=macdY(0),y=macdY(v),bh=Math.max(1,Math.abs(zero-y));return `<rect x="${(r.x-bodyW/2).toFixed(1)}" y="${Math.min(zero,y).toFixed(1)}" width="${bodyW.toFixed(1)}" height="${bh.toFixed(1)}" class="hist ${v>=0?'histup':'histdown'}"/>`}).join('');

function setChartTimeframe(timeframe){
  const x=window.__chartStock;
  if(!x)return;
  const el=document.getElementById('chart-panel');
  if(el)el.innerHTML=chart(x,timeframe);
}

function forecastPerBox(x){
  return `<div class="section"><div class="section-title">💹 PER推移（実績 → 直近予想）</div><button type="button" class="pertoggle" id="perToggle" onclick="togglePerChart()">▶ PER推移を表示</button><div id="per-panel" style="display:none"></div></div>`;
}
function getStoredPerData(x){
  const d=x?.details||{};
  const forecast=d.per_forecast||{};
  return {
    actual:d.per_history||[],
    forecastPe:Number.isFinite(Number(forecast.forecast_pe))?Number(forecast.forecast_pe):null,
    forecastEps:Number.isFinite(Number(forecast.forecast_eps))?Number(forecast.forecast_eps):null,
    switchDate:forecast.switch_date||null,
    forecastError:d.per_forecast_error||null,
    updatedAt:d.per_updated_at||null
  };
}
function renderPerChart(x,data){
  const d=x.details||{}, weekly=d.chart_history_weekly||[];
  const panel=document.getElementById('per-panel'); if(!panel)return;
  const eps=Number(data.forecastEps), currentPe=Number(data.forecastPe), switchDate=data.switchDate||null;
  const actual=(data.actual||[]).map(r=>({date:r.date||r.fiscal_year, label:r.fiscal_year||r.date, pe:Number(r.per), kind:'actual'})).filter(r=>r.date&&Number.isFinite(r.pe)&&r.pe>0);
  const forecast=weekly.map(r=>({date:r.date,pe:Number.isFinite(eps)&&eps>0?Number(r.close)/eps:null,kind:'forecast'})).filter(r=>r.date&&Number.isFinite(r.pe)&&(!switchDate||r.date>=switchDate));
  const rows=[...actual.filter(r=>!switchDate||r.date<switchDate),...forecast].sort((a,b)=>String(a.date).localeCompare(String(b.date)));
  if(!rows.length){panel.innerHTML='<div class="pernote">保存されたPER時系列データがありません。次回Daily stock updateで取得します。</div>';return;}
  const w=820,H=250,left=58,right=16,top=16,bottom=30,plotH=H-top-bottom;
  const vals=rows.map(r=>r.pe).filter(Number.isFinite); const lo=Math.min(...vals),hi=Math.max(...vals),span=(hi-lo)||1;
  const pad=Math.max(span*.08,1),ymin=Math.max(0,lo-pad),ymax=hi+pad;
  const xOf=i=>left+i/Math.max(1,rows.length-1)*(w-left-right);
  const yOf=v=>top+(1-(v-ymin)/(ymax-ymin))*plotH;
  const step=(ymax-ymin)/4;
  const grid=[0,1,2,3,4].map(i=>{const v=ymin+step*i;return `<line x1="${left}" y1="${yOf(v).toFixed(1)}" x2="${w-right}" y2="${yOf(v).toFixed(1)}" class="gridline"/><text x="${left-7}" y="${(yOf(v)+3.5).toFixed(1)}" class="axisprice" text-anchor="end">${v.toFixed(1)}</text>`}).join('');
  const actualRows=rows.map((r,i)=>({r,i})).filter(o=>o.r.kind==='actual');
  const forecastRows=rows.map((r,i)=>({r,i})).filter(o=>o.r.kind==='forecast');
  const pathFor=items=>items.map((o,j)=>(j?'L':'M')+xOf(o.i).toFixed(1)+' '+yOf(o.r.pe).toFixed(1)).join(' ');
  const actualPath=actualRows.length>1?`<path d="${pathFor(actualRows)}" fill="none" stroke="#475467" stroke-width="2"/>`:'';
  const forecastPath=forecastRows.length>1?`<path d="${pathFor(forecastRows)}" fill="none" stroke="#2563eb" stroke-width="2.2"/>`:'';
  const switchIdx=switchDate?rows.findIndex(r=>r.kind==='forecast'&&r.date>=switchDate):-1;
  const switchLine=switchIdx>=0?`<line x1="${xOf(switchIdx).toFixed(1)}" y1="${top}" x2="${xOf(switchIdx).toFixed(1)}" y2="${top+plotH}" stroke="#f59e0b" stroke-width="1.2" stroke-dasharray="5 4"/><text x="${Math.min(w-right-4,xOf(switchIdx)+5).toFixed(1)}" y="${top+12}" class="axisprice">予想PER開始 ${esc(switchDate)}</text>`:'';
  const dates=[0,Math.round((rows.length-1)*.5),rows.length-1].filter((v,i,a)=>a.indexOf(v)===i).map(i=>`<text x="${xOf(i).toFixed(1)}" y="${H-8}" class="axisdate" text-anchor="middle">${esc(String(rows[i].label||rows[i].date||'').slice(0,7))}</text>`).join('');
  const currentRow=forecast.length?forecast[forecast.length-1]:actual[actual.length-1];
  const currentValue=currentRow&&Number.isFinite(currentRow.pe)?currentRow.pe:null;
  const currentIdx=currentRow?rows.findIndex(r=>r.date===currentRow.date&&r.kind===currentRow.kind):-1;
  const currentLine=currentIdx>=0&&currentValue!=null?`<line x1="${xOf(currentIdx).toFixed(1)}" y1="${top}" x2="${xOf(currentIdx).toFixed(1)}" y2="${top+plotH}" stroke="#f59e0b" stroke-width="1.2" stroke-dasharray="2 3"/><circle cx="${xOf(currentIdx).toFixed(1)}" cy="${yOf(currentValue).toFixed(1)}" r="4" fill="#f59e0b"/>`:'';
  const loActual=actual.length?Math.min(...actual.map(r=>r.pe)):null, hiActual=actual.length?Math.max(...actual.map(r=>r.pe)):null;
  const note=switchDate
    ? `過去20年度の実績PERはIRBANKの年次バリュエーションをDaily stock updateで保存。${switchDate}以降は保存済みの会社予想EPSを使って週次終値から予想PERを表示。`
    : `過去20年度の実績PERはIRBANKから保存済み。会社予想EPSの取得情報がないため、予想PER部分は表示していません。`;
  const positionNote=Number.isFinite(currentValue)?`現在位置：${currentValue.toFixed(2)}倍`+(Number.isFinite(loActual)&&Number.isFinite(hiActual)?`（実績PER範囲 ${loActual.toFixed(2)}〜${hiActual.toFixed(2)}倍）`:''):'';
  panel.innerHTML=`<div class="perbox"><div class="charttitle">📈 PER推移：過去20年度の実績PER → 直近予想EPS以降の予想PER</div><div class="chartwrap"><svg class="persvg" viewBox="0 0 ${w} ${H}" preserveAspectRatio="none"><g>${grid}</g><line x1="${left}" y1="${top}" x2="${left}" y2="${top+plotH}" class="axisline"/>${actualPath}${forecastPath}${switchLine}${currentLine}<g>${dates}</g></svg></div><div class="legend"><span><i class="perdot actual"></i>実績PER（20年度）</span><span><i class="perdot forecast"></i>予想PER（会社予想EPS）</span><span><i class="perdot current"></i>現在位置</span>${Number.isFinite(eps)?`<span>予想EPS ${eps.toFixed(2)}円</span>`:''}${Number.isFinite(currentPe)?`<span class="percurrent">現在の予想PER ${currentPe.toFixed(2)}倍</span>`:''}</div><div class="pernote">${esc(note)} ${esc(positionNote)}${data.updatedAt?` データ更新：${esc(String(data.updatedAt).replace('T',' ').slice(0,16))}`:''}${data.forecastError?` 会社予想取得エラー：${esc(data.forecastError)}`:''}</div></div>`;
}
function togglePerChart(){
  const panel=document.getElementById('per-panel'),btn=document.getElementById('perToggle'),x=window.__chartStock;
  if(!panel||!btn||!x)return;
  if(panel.style.display!=='none'){panel.style.display='none';btn.textContent='▶ PER推移を表示';return;}
  panel.style.display='block';
  renderPerChart(x,getStoredPerData(x));
  btn.textContent='▼ PER推移を隠す';
}

function details(x){const d=x.details||{},s=d.supply||{},i=d.interpretation||{}, checks=d.condition_checks||[],c=d.candle_signal||{},bo=d.breakout_signal||{};const ss=d.supply_status||s.status||'データ不足'; const risk=d.drawdown60; const pos=d.range_position60; return `<details class="detail"><summary>詳細な中間情報を表示</summary><div id="chart-panel">${chart(x)}</div>${forecastPerBox(x)}
<div class="section"><div class="section-title">📐 移動平均・乖離</div><div class="grid">
${metric('5日MA',d.ma5)}${metric('5日MA乖離',d.vs5,'%')}${metric('20日MA',d.ma20)}${metric('20日MA乖離',d.vs20,'%')}${metric('25日MA',d.ma25)}${metric('25日MA乖離',d.vs25,'%')}${metric('75日MA',d.ma75)}${metric('75日MA乖離',d.vs75,'%')}${metric('200日MA',d.ma200)}${metric('200日MA乖離',d.vs200,'%')}${metric('60日高値から',d.drawdown60,'%')}${metric('60日レンジ位置',d.range_position60,'%')}
</div><div class="tagline"><span class="tag">5MA: ${esc(i.vs5||'—')}</span><span class="tag">20MA: ${esc(i.vs20||'—')}</span><span class="tag">25MA: ${esc(i.vs25||'—')}</span><span class="tag">75MA: ${esc(i.vs75||'—')}</span><span class="tag">200MA: ${esc(i.vs200||'—')}</span><span class="tag">${esc(i.range60||'—')}</span></div></div>
<div class="section"><div class="section-title">📊 勢い・変動</div><div class="grid">${metric('20日騰落率',d.ret20,'%')}${metric('20日変動率',d.volatility20,'%')}${metric('20日高値',d.high20)}${metric('20日安値',d.low20)}${metric('60日高値',d.high60)}${metric('60日安値',d.low60)}${rsiMetric('RSI日足',d.rsi14)}${metric('RSI日足状態',i.rsi||'—')}${rsiMetric('RSI週足',d.rsi14_weekly)}${metric('RSI週足状態',i.rsi_weekly||'—')}${metric('出来高状態',i.volume||'—')}${metric('MACD(12,26)',d.macd!=null?d.macd.toFixed(3):'—')}${metric('MACDシグナル',d.macd_signal!=null?d.macd_signal.toFixed(3):'—')}${metric('MACDヒストグラム',d.macd_hist!=null?d.macd_hist.toFixed(3):'—')}${metric('月足MACD',d.monthly_macd!=null?d.monthly_macd.toFixed(3):'—')}${metric('月足MACDシグナル',d.monthly_macd_signal!=null?d.monthly_macd_signal.toFixed(3):'—')}${metric('月足MACDヒストグラム',d.monthly_macd_hist!=null?d.monthly_macd_hist.toFixed(3):'—')}${metric('月足MACD状態',d.monthly_macd_state||'—')}${metric('月足データ',d.monthly_points||'—','か月')}</div></div>
<div class="section"><div class="section-title">〽️ ボリンジャーバンド</div><div class="grid">${metric('日足BB期間','25日')}${metric('日足+2σ',d.bb_daily?.upper)}${metric('日足-2σ',d.bb_daily?.lower)}${metric('日足判定',d.bb_daily?.status||'なし')}${metric('週足BB期間','13週')}${metric('週足+2σ',d.bb_weekly?.upper)}${metric('週足-2σ',d.bb_weekly?.lower)}${metric('週足判定',d.bb_weekly?.status||'なし')}</div><div class="reason">終値が±2σの外側に出た場合だけ独立サインを点灯します。上抜けは強い上昇・過熱、下抜けは強い下落・売られ過ぎの可能性として扱い、単独ではBUY/SELLを決めません。</div></div><div class="section"><div class="section-title">🟣 大底候補（月足MACD×週足RSI）</div><div class="reason">週足RSI30以下を前提に、月足MACDがゴールデンクロス、またはGC手前でヒストグラム（MACD−シグナル）が2か月連続で縮小した場合だけ点灯する非常に厳しいサインです。<strong>${esc(d.monthly_rsi_bottom_signal?.reason||'現在は該当なし')}</strong></div></div><div class="section"><div class="section-title">📅 週足＝方向</div><div class="grid">${metric('5週MA',d.weekly_ma5)}${metric('5週MA乖離',d.weekly_vs5,'%')}${metric('13週MA',d.weekly_ma13)}${metric('13週MA乖離',d.weekly_vs13,'%')}${metric('26週MA',d.weekly_ma26)}${metric('26週MA乖離',d.weekly_vs26,'%')}${metric('52週MA',d.weekly_ma52)}${metric('52週MA乖離',d.weekly_vs52,'%')}${metric('13週MA 4週傾き',d.weekly_ma13_slope4w,'%')}${metric('26週MA 4週傾き',d.weekly_ma26_slope4w,'%')}${metric('週足データ',d.weekly_points,'週')}</div><div class="reason">${esc(x.regime_reason||'')}</div></div><div class="section"><div class="section-title">📆 月足＝長期位置</div><div class="grid">${metric('6か月MA',d.monthly_ma6)}${metric('12か月MA',d.monthly_ma12)}${metric('18か月MA',d.monthly_ma18)}${metric('月足データ',d.monthly_points,'か月')}</div><div class="reason">月足は6・12・18か月MAで長期の位置を確認します。18か月MAが算出できるだけの履歴を確保し、表示は直近18か月です。</div></div>
<div class="section"><div class="section-title">📈 レンジ抜け・再上昇チェック</div><div class="reason">${esc(bo.reason||'レンジ抜けシグナルなし')}</div><div class="grid">${metric('判定',bo.status||'なし')}${metric('突破日',bo.breakout_date||'—')}${metric('突破水準',bo.breakout_level,'円')}${metric('突破時出来高比',bo.breakout_volume_ratio,'倍')}${metric('突破後乖離',bo.distance_from_breakout,'%')}${metric('5日騰落率',bo.ret5,'%')}</div></div><div class="section"><div class="section-title">🕯️ ローソク足・大底反転チェック</div><div class="reason">${esc(c.reason||'明確な反転パターンなし')}</div><div class="grid">${metric('サイン',c.status||'なし')}${metric('強さ',c.strength||'—')}${metric('底値圏',c.bottom_zone?'はい':'いいえ')}${metric('確認',c.confirmation||'—')}</div>${(c.patterns||[]).length?`<div class="tagline">${c.patterns.map(v=>`<span class="tag">${esc(v.label)}</span>`).join('')}</div>`:''}</div>
<div class="section"><div class="section-title">📦 需給</div><div class="grid">${metric('需給判定',ss,'',supplyClass(ss))}${metric('信用倍率',s.credit_ratio,'倍')}${metric('信用買い残',s.buy_balance)}${metric('信用売り残',s.sell_balance)}${metric('買い残 前週比',s.buy_change)}${metric('売り残 前週比',s.sell_change)}${metric('ネット信用残（買−売）',s.net_balance)}${metric('ネット増減（買前週比−売前週比）',s.net_change)}</div><div class="reason" style="margin-top:6px">${esc(d.supply_reason||'需給データなし')}</div><div class="mini" style="margin-top:4px">${esc(s.source_note||'')}</div></div>
<div class="section"><div class="section-title">🎯 買いサインの進み具合</div>${checks.length?`<div class="checks">${conditionRows(checks)}</div>`:'<div class="reason">買い条件を適用できる状態ではありません。</div>'}<div class="reason" style="margin-top:6px">${esc(x.signal_reason||'')}</div>${x.one_condition_away?'<div class="tagline"><span class="pill">あと1条件で暫定BUY候補</span></div>':''}</div>
<div class="section"><div class="section-title">🌐 市場との比較</div><div class="grid">${metric('日経平均 前日比',d.nikkei_change,'%')}${metric('銘柄−日経',d.relative_strength,'%')}${metric('6日市場騰落比',d.breadth?.['6d'])}${metric('10日市場騰落比',d.breadth?.['10d'])}</div><div class="mini" style="margin-top:5px">市場が弱い日でも相対的に強い銘柄を残すための参考情報です。</div></div>
<div class="section"><div class="section-title">⚠️ 下値・位置</div><div class="mini">60日高値から ${pct(risk)} / 60日レンジ位置 ${pct(pos,1)}</div><div class="bar"><i style="width:${Math.max(0,Math.min(100,Number(pos)||0))}%"></i></div></div>
<div class="footer">株価データ: ${esc(d.date||'—')} / 需給データ: ${esc(s.date||'—')} / 出典: ${esc((d.attribution&&d.attribution.source_label)||'IRBANK API')}</div></details>`}

function iconClass(code){return code==='SUPPLY_BUY'||code==='SUPPLY_IMPROVING'?'supply':code==='BOTTOM_VOLUME'||code==='BOTTOM_REVERSAL'?'bottom':code.startsWith('RANGE_')?'breakout':code.startsWith('RSI_')?'rsi':code.startsWith('BB_')?'bb':code==='MONTHLY_MACD_BOTTOM'?'bottom':code==='EXTENDED'?'warn':''}
function iconHtml(x){const arr=(x.signal_icons||[]).slice();if(x.signal==='BUY_CANDIDATE')arr.unshift({code:'AGG_BUY',icon:'🟢',label:'総合BUY',reason:x.signal_reason||''});return arr.length?'<div class=\"signal-icons\">'+arr.map(i=>'<span class=\"signal-icon '+(i.code==='AGG_BUY'?'buy':iconClass(i.code))+'\">'+esc(i.icon)+' '+esc(i.label)+'</span>').join('')+'</div>':''}
function renderDetail(payload){const code=new URLSearchParams(location.search).get('code');const x=(payload.ranking||[]).find(v=>String(v.code)===String(code));if(!x){document.getElementById('content').innerHTML='<div class="card error">銘柄データが見つかりません。<br><a href="./index.html">一覧に戻る</a></div>';return;}window.__chartStock=x;document.title=(x.name||x.code)+' | 株スコア';document.getElementById('head').innerHTML='<a class="back" href="./index.html">← 一覧に戻る</a><a class="navlink" href="./signals.html">🚦 サイン一覧</a><div class="detail-page-title">'+esc(x.name||x.code)+'</div>'+iconHtml(x)+'<div class="muted">'+esc(x.code)+'　'+(jp[x.regime]||esc(x.regime||''))+'　'+(sg[x.signal]||esc(x.signal||''))+'</div><div class="reason" style="margin-top:6px">'+esc(x.signal_reason||x.regime_reason||'')+'</div>';document.getElementById('content').innerHTML='<div class="card">'+oneLine(x)+'<div class="signalbox"><div class="section-title">🎯 買いサイン</div><div class="reason">'+esc(x.signal_reason||'')+'</div>'+(x.details?.condition_checks?.length?'<div class="checks" style="margin-top:7px">'+conditionRows(x.details.condition_checks)+'</div>':'')+'</div>'+details(x).replace('<details class="detail">','<details class="detail" open>')+'</div>';}
Promise.all([fetch('./data/decision_ranking.json?'+Date.now(),{cache:'no-store'}).then(r=>{if(!r.ok)throw Error('日次ランキングがありません');return r.json()}),fetch('./data/stocks.json?'+Date.now(),{cache:'no-store'}).then(r=>r.ok?r.json():null).catch(()=>null)]).then(([ranking,stocks])=>{if(stocks?.stocks){for(const item of (ranking.ranking||[])){const raw=stocks.stocks[String(item.code)];if(raw){item.details=item.details||{};for(const k of ['chart_history','chart_history_weekly','chart_history_monthly']){if(!item.details[k]||!item.details[k].length)item.details[k]=raw[k]||[];}}}}renderDetail(ranking)}).catch(e=>{document.getElementById('content').innerHTML='<div class="card error">'+esc(e.message)+'<br><a href="./index.html">一覧に戻る</a></div>';});if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js?ver=20260926-display-fix-3').catch(()=>{});
</script></body></html>
