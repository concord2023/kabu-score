"margin-top:6px"><strong>ハンマー：</strong>下ヒゲが長く、実体が小さく、終値が高値側にあるローソク足です。下落中に一度大きく売られたものの、その後買い戻されて下値を拒否した形で、底打ち・反転の手掛かりとして使われます。ただし、ハンマーだけで底打ち確定とは判定しません。</div></div>
<div class="section"><div class="section-title">📦 需給</div><div class="grid">${metric('需給判定',ss,'',supplyClass(ss))}${metric('信用倍率',s.credit_ratio,'倍')}${metric('信用買い残',s.buy_balance)}${metric('信用売り残',s.sell_balance)}${metric('買い残 前週比',s.buy_change)}${metric('売り残 前週比',s.sell_change)}${metric('ネット信用残（買−売）',s.net_balance)}${metric('ネット増減（買前週比−売前週比）',s.net_change)}</div><div class="reason" style="margin-top:6px">${esc(d.supply_reason||'需給データなし')}</div><div class="mini" style="margin-top:4px">${esc(s.source_note||'')}</div></div>

<div class="section"><div class="section-title">🌐 市場との比較</div><div class="grid">${metric('日経平均 前日比',d.nikkei_change,'%')}${metric('銘柄−日経',d.relative_strength,'%')}${metric('6日市場騰落比',d.breadth?.['6d'])}${metric('10日市場騰落比',d.breadth?.['10d'])}</div><div class="mini" style="margin-top:5px">市場が弱い日でも相対的に強い銘柄を残すための参考情報です。</div></div>
<div class="section"><div class="section-title">⚠️ 下値・位置</div><div class="mini">60日高値から ${pct(risk)} / 60日レンジ位置 ${pct(pos,1)}</div><div class="bar"><i style="width:${Math.max(0,Math.min(100,Number(pos)||0))}%"></i></div></div>
<div class="footer">株価データ: ${esc(d.date||'—')} / 需給データ: ${esc(s.date||'—')} / 出典: ${esc((d.attribution&&d.attribution.source_label)||'IRBANK API')}</div></details>`}

function iconClass(code){return code==='SUPPLY_BUY'||code==='SUPPLY_IMPROVING'?'supply':code==='BOTTOM_VOLUME'||code==='BOTTOM_REVERSAL'?'bottom':code.startsWith('RANGE_')?'breakout':code.startsWith('RSI_')?'rsi':code.startsWith('BB_')?'bb':code==='MONTHLY_MACD_BOTTOM'?'bottom':code==='EXTENDED'?'warn':''}
function iconHtml(x){const arr=(x.signal_icons||[]).slice();if(x.signal==='BUY_CANDIDATE')arr.unshift({code:'AGG_BUY',icon:'🟢',label:'総合BUY',reason:x.signal_reason||''});return arr.length?'<div class=\"signal-icons\">'+arr.map(i=>'<span class=\"signal-icon '+(i.code==='AGG_BUY'?'buy':iconClass(i.code))+'\">'+esc(i.icon)+' '+esc(i.label)+'</span>').join('')+'</div>':''}
function renderDetail(payload){const code=new URLSearchParams(location.search).get('code');const x=(payload.ranking||[]).find(v=>String(v.code)===String(code));if(!x){document.getElementById('content').innerHTML='<div class="card error">銘柄データが見つかりません。<br><a href="./index.html">一覧に戻る</a></div>';return;}window.__chartStock=x;document.title=(x.name||x.code)+' | 株スコア';document.getElementById('head').innerHTML='<a class="back" href="./index.html">← 一覧に戻る</a><a class="navlink" href="./signals.html">🚦 サイン一覧</a><div class="detail-page-title">'+esc(x.name||x.code)+'</div>'+iconHtml(x)+'<div class="muted">'+esc(x.code)+'　'+(jp[x.regime]||esc(x.regime||''))+'　'+(sg[x.signal]||esc(x.signal||''))+'</div><div class="reason" style="margin-top:6px">'+esc(x.signal_reason||x.regime_reason||'')+'</div>';document.getElementById('content').innerHTML='<div class="card"><div id="chart-panel">'+chart(x)+'</div>'+oneLine(x)+'<div class="signalbox"><div class="section-title">🎯 買いサイン</div><div class="reason">'+esc(x.signal_reason||'')+'</div>'+(x.details?.condition_checks?.length?'<div class="checks" style="margin-top:7px">'+conditionRows(x.details.condition_checks)+'</div>':'')+'</div>'+forecastPerBox(x)+details(x).replace('<details class="detail">','<details class="detail" open>')+'</div>';}
Promise.all([fetch('./data/decision_ranking.json?'+Date.now(),{cache:'no-store'}).then(r=>{if(!r.ok)throw Error('日次ランキングがありません');return r.json()}),fetch('./data/stocks.json?'+Date.now(),{cache:'no-store'}).then(r=>r.ok?r.json():null).catch(()=>null)]).then(([ranking,stocks])=>{if(stocks?.stocks){for(const item of (ranking.ranking||[])){const raw=stocks.stocks[String(item.code)];if(raw){item.details=item.details||{};for(const k of ['chart_history','chart_history_weekly','chart_history_monthly','per_history','per_5y_avg','per_forecast','per_forecast_error','per_updated_at','per_actual_attribution','per_forecast_eps','per_forecast_pe']){const v=item.details[k],rv=raw[k];const empty=v==null||(Array.isArray(v)&&!v.length)||(typeof v==='object'&&!Array.isArray(v)&&v!==null&&!Object.keys(v).length);if(empty&&rv!=null)item.details[k]=rv;}}}}renderDetail(ranking)}).catch(e=>{document.getElementById('content').innerHTML='<div class="card error">'+esc(e.message)+'<br><a href="./index.html">一覧に戻る</a></div>';});if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js?ver=20261003-candle-confirmation').catch(()=>{});
</script></body></html>
