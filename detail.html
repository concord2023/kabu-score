const jp={UPTREND:'🟢 上昇トレンド',UPTREND_PULLBACK:'🟡 上昇・押し目',DOWNTREND_REVERSAL_WAIT:'🟠 下降・反転待ち',DOWNTREND_REVERSAL_CONFIRMED:'🟢 下降・反転確認',DOWNTREND_CONTINUED:'🔴 下降継続',RANGE_TRANSITION:'🟣 レンジ・転換',UNKNOWN:'⚪ 判定不能'};
const sg={BUY_CANDIDATE:'BUY候補',WATCH:'WATCH',AVOID:'AVOID',INSUFFICIENT:'データ不足'};

const num=(v,d=2)=>v==null?'—':Number(v).toFixed(d);

function cls(v){return v==null?'':Number(v)>0?'good':Number(v)<0?'bad':''}
function metric(label,v,unit='',c=''){return `<div class="metric ${c}"><span>${label}</span><b>${v==null?'—':esc(v)+unit}</b></div>`}

function oneLine(x){const d=x.details||{},s=d.supply||{},i=d.interpretation||{},c=d.candle_signal||{},bo=d.breakout_signal||{};const ss=d.supply_status||s.status||'データ不足';return `<div class="grid">
${metric('株価',d.price)}${metric('前日比',d.change,'%',cls(d.change))}${metric('20日MA乖離',d.vs20,'%',cls(d.vs20))}${metric('75日MA乖離',d.vs75,'%',cls(d.vs75))}${metric('200日MA乖離',d.vs200,'%',cls(d.vs200))}
${metric('5日騰落率',d.ret5,'%',cls(d.ret5))}${metric('10日騰落率',d.ret10,'%',cls(d.ret10))}${metric('RSI日足(14)',d.rsi14,'',d.rsi14!=null&&d.rsi14<30?'good':d.rsi14!=null&&d.rsi14>70?'bad':'')}${metric('RSI週足(14)',d.rsi14_weekly,'',d.rsi14_weekly!=null&&d.rsi14_weekly<30?'good':d.rsi14_weekly!=null&&d.rsi14_weekly>70?'bad':'')}${metric('出来高/20日',d.volume_ratio,'倍')}
${metric('需給',ss,'',supplyClass(ss))}${metric('信用倍率',s.credit_ratio,'倍')}${metric('買い残 前週比',s.buy_change)}${metric('銘柄−日経',d.relative_strength,'%',cls(d.relative_strength))}

function chart(x){
  const h=x.details?.chart_history||[];
  if(h.length<10)return '<div class="chartbox"><div class="charttitle">📊 テクニカルチャート</div><div class="mini">チャート用の履歴データが不足しています。</div></div>';
  const w=820,left=58,right=16,top=12,mainH=300,gap=18,volH=78,rsiH=105,macdH=110;
  const volTop=top+mainH+gap, rsiTop=volTop+volH+gap, macdTop=rsiTop+rsiH+gap, H=macdTop+macdH+32;
  const points=h.map((r,i)=>({...r,x:left+i/(h.length-1)*(w-left-right)}));
  const priceVals=h.flatMap(r=>[r.high,r.low,r.ma5,r.ma25,r.ma75,r.ma200,r.bb25_upper,r.bb25_lower].map(Number).filter(v=>Number.isFinite(v)));
  if(!priceVals.length)return '<div class="chartbox"><div class="mini">価格データがありません。</div></div>';
  const lo=Math.min(...priceVals),hi=Math.max(...priceVals),span=(hi-lo)||1;
  const niceStep=raw=>{const p=Math.pow(10,Math.floor(Math.log10(raw||1))),n=raw/p;return (n<=1?1:n<=2?2:n<=5?5:10)*p};
  const step=niceStep(span/5),axisMin=Math.floor(lo/step)*step,axisMax=Math.ceil(hi/step)*step;
  const yy=v=>top+(1-(v-axisMin)/((axisMax-axisMin)||1))*(mainH);
  const fmtPrice=v=>Number.isInteger(v)?String(v):v.toFixed(1);
  const maPath=key=>points.filter(r=>Number.isFinite(Number(r[key]))).map((r,i)=>(i?'L':'M')+r.x.toFixed(1)+' '+yy(Number(r[key])).toFixed(1)).join(' ');
  const ma5=maPath('ma5'),ma25=maPath('ma25'),ma75=maPath('ma75'),ma200=maPath('ma200'),bbup=maPath('bb25_upper'),bblow=maPath('bb25_lower');
  const bodyW=Math.max(2,Math.min(8,(w-left-right)/h.length*0.62));
  const candles=points.map(r=>{const o=Number(r.open),hi0=Number(r.high),lo0=Number(r.low),c=Number(r.close);if(![o,hi0,lo0,c].every(Number.isFinite))return '';const up=c>=o,topBody=yy(Math.max(o,c)),botBody=yy(Math.min(o,c)),bodyH=Math.max(1,botBody-topBody),cls=up?'up':'down';return `<line x1="${r.x.toFixed(1)}" y1="${yy(hi0).toFixed(1)}" x2="${r.x.toFixed(1)}" y2="${yy(lo0).toFixed(1)}" class="wick ${cls}"/><rect x="${(r.x-bodyW/2).toFixed(1)}" y="${topBody.toFixed(1)}" width="${bodyW.toFixed(1)}" height="${bodyH.toFixed(1)}" class="body ${cls}"/>`}).join('');
  const ticks=[];for(let v=axisMin;v<=axisMax+step*0.01;v+=step)ticks.push(v);
  const grid=ticks.map(v=>`<line x1="${left}" y1="${yy(v).toFixed(1)}" x2="${w-right}" y2="${yy(v).toFixed(1)}" class="gridline"/><text x="${left-7}" y="${(yy(v)+3.5).toFixed(1)}" class="axisprice" text-anchor="end">${esc(fmtPrice(v))}</text>`).join('');
  const maxVol=Math.max(...h.map(r=>Number(r.volume)||0),1);
  const volumeBars=points.map(r=>{const v=Number(r.volume);if(!Number.isFinite(v))return '';const bh=(v/maxVol)*(volH-18), up=Number(r.close)>=Number(r.open);return `<rect x="${(r.x-bodyW/2).toFixed(1)}" y="${(volTop+volH-bh).toFixed(1)}" width="${bodyW.toFixed(1)}" height="${Math.max(1,bh).toFixed(1)}" class="vol ${up?'volup':'voldown'}"/>`}).join('');
  const volumeMa=points.filter(r=>Number.isFinite(Number(r.volume_ma20))).map((r,i)=>{const v=Math.min(Number(r.volume_ma20),maxVol);return (i?'L':'M')+r.x.toFixed(1)+' '+(volTop+volH-(v/maxVol)*(volH-18)).toFixed(1)}).join(' ');
  const rsiY=v=>rsiTop+(1-Math.max(0,Math.min(100,v))/100)*rsiH;
  const rsiPath=points.filter(r=>Number.isFinite(Number(r.rsi14))).map((r,i)=>(i?'L':'M')+r.x.toFixed(1)+' '+rsiY(Number(r.rsi14)).toFixed(1)).join(' ');
  const rsi30=rsiY(30),rsi70=rsiY(70);
  const macdVals=h.flatMap(r=>[r.macd,r.macd_signal,r.macd_hist].map(Number).filter(v=>Number.isFinite(v)));
  const mAbs=Math.max(...macdVals.map(v=>Math.abs(v)),0.001),mMin=-mAbs,mMax=mAbs;
  const macdY=v=>macdTop+(1-(v-mMin)/(mMax-mMin))*macdH;
  const macdPath=key=>points.filter(r=>Number.isFinite(Number(r[key]))).map((r,i)=>(i?'L':'M')+r.x.toFixed(1)+' '+macdY(Number(r[key])).toFixed(1)).join(' ');
  const histBars=points.map(r=>{const v=Number(r.macd_hist);if(!Number.isFinite(v))return '';const zero=macdY(0),y=macdY(v),bh=Math.max(1,Math.abs(zero-y));return `<rect x="${(r.x-bodyW/2).toFixed(1)}" y="${Math.min(zero,y).toFixed(1)}" width="${bodyW.toFixed(1)}" height="${bh.toFixed(1)}" class="hist ${v>=0?'histup':'histdown'}"/>`}).join('');
  const xTicks=[0,Math.round((h.length-1)*.25),Math.round((h.length-1)*.5),Math.round((h.length-1)*.75),h.length-1].filter((v,i,a)=>a.indexOf(v)===i).map(i=>`<line x1="${points[i].x.toFixed(1)}" y1="${macdTop+macdH}" x2="${points[i].x.toFixed(1)}" y2="${macdTop+macdH+4}" class="axisline"/><text x="${points[i].x.toFixed(1)}" y="${H-9}" class="axisdate" text-anchor="middle">${esc(String(points[i].date||'').slice(5))}</text>`).join('');
  const last=h[h.length-1]?.date||'',first=h[0]?.date||'';
  return `<div class="chartbox"><div class="charttitle">📊 直近100営業日：ローソク足＋5/25/75/200MA＋BB＋出来高＋RSI(14)＋MACD(12,26,9)</div><div class="chartwrap"><svg class="chartsvg" viewBox="0 0 ${w} ${H}" preserveAspectRatio="none"><g>${grid}</g><line x1="${left}" y1="${top}" x2="${left}" y2="${top+mainH}" class="axisline"/><text x="10" y="${top+8}" class="axislabel">価格（円）</text><g>${candles}</g><path d="${bbup}" fill="none" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="4 3"/><path d="${bblow}" fill="none" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="4 3"/><path d="${ma5}" fill="none" stroke="#16a34a" stroke-width="1.6"/><path d="${ma25}" fill="none" stroke="#0ea5e9" stroke-width="1.8"/><path d="${ma75}" fill="none" stroke="#8b5cf6" stroke-width="2.2"/><path d="${ma200}" fill="none" stroke="#ef4444" stroke-width="2.5"/>
  <line x1="${left}" y1="${volTop}" x2="${w-right}" y2="${volTop}" class="panelline"/><text x="10" y="${volTop+11}" class="axislabel">出来高</text><g>${volumeBars}</g><path d="${volumeMa}" fill="none" stroke="#64748b" stroke-width="1.2"/><text x="${w-right}" y="${volTop+11}" class="panelvalue" text-anchor="end">20日平均</text>
  <line x1="${left}" y1="${rsiTop}" x2="${w-right}" y2="${rsiTop}" class="panelline"/><text x="10" y="${rsiTop+11}" class="axislabel">RSI(14)</text><line x1="${left}" y1="${rsi70.toFixed(1)}" x2="${w-right}" y2="${rsi70.toFixed(1)}" class="threshold"/><line x1="${left}" y1="${rsi30.toFixed(1)}" x2="${w-right}" y2="${rsi30.toFixed(1)}" class="threshold"/><text x="${left-7}" y="${(rsi70+3).toFixed(1)}" class="axisprice" text-anchor="end">70</text><text x="${left-7}" y="${(rsi30+3).toFixed(1)}" class="axisprice" text-anchor="end">30</text><path d="${rsiPath}" fill="none" stroke="#7c3aed" stroke-width="1.8"/>
  <line x1="${left}" y1="${macdTop}" x2="${w-right}" y2="${macdTop}" class="panelline"/><text x="10" y="${macdTop+11}" class="axislabel">MACD(12,26,9)</text><line x1="${left}" y1="${macdY(0).toFixed(1)}" x2="${w-right}" y2="${macdY(0).toFixed(1)}" class="threshold"/><g>${histBars}</g><path d="${macdPath('macd')}" fill="none" stroke="#2563eb" stroke-width="1.8"/><path d="${macdPath('macd_signal')}" fill="none" stroke="#f59e0b" stroke-width="1.6"/>
  <g>${xTicks}</g></svg></div><div class="legend"><span><i class="candlekey up"></i>陽線</span><span><i class="candlekey down"></i>陰線</span><span><i class="dot ma5"></i>5日MA</span><span><i class="dot ma25"></i>25日MA</span><span><i class="dot ma75"></i>75日MA</span><span><i class="dot ma200"></i>200日MA</span><span><i class="dot bbup"></i>BB ±2σ</span><span>出来高＋20日平均</span><span>RSI 30/70</span><span>MACD＋シグナル＋ヒストグラム</span><span>${esc(first)} → ${esc(last)}</span></div></div>`
}
function details(x){const d=x.details||{},s=d.supply||{},i=d.interpretation||{}, checks=d.condition_checks||[],c=d.candle_signal||{},bo=d.breakout_signal||{};const ss=d.supply_status||s.status||'データ不足'; const risk=d.drawdown60; const pos=d.range_position60; return `<details class="detail"><summary>詳細な中間情報を表示</summary>${chart(x)}
<div class="section"><div class="section-title">📐 移動平均・乖離</div><div class="grid">

function iconClass(code){return code==='SUPPLY_BUY'||code==='SUPPLY_IMPROVING'?'supply':code==='BOTTOM_VOLUME'||code==='BOTTOM_REVERSAL'?'bottom':code.startsWith('RANGE_')?'breakout':code.startsWith('RSI_')?'rsi':code.startsWith('BB_')?'bb':code==='MONTHLY_MACD_BOTTOM'?'bottom':code==='EXTENDED'?'warn':''}
function iconHtml(x){const arr=(x.signal_icons||[]).slice();if(x.signal==='BUY_CANDIDATE')arr.unshift({code:'AGG_BUY',icon:'🟢',label:'総合BUY',reason:x.signal_reason||''});return arr.length?'<div class=\"signal-icons\">'+arr.map(i=>'<span class=\"signal-icon '+(i.code==='AGG_BUY'?'buy':iconClass(i.code))+'\">'+esc(i.icon)+' '+esc(i.label)+'</span>').join('')+'</div>':''}
function renderDetail(payload){const code=new URLSearchParams(location.search).get('code');const x=(payload.ranking||[]).find(v=>String(v.code)===String(code));if(!x){document.getElementById('content').innerHTML='<div class="card error">銘柄データが見つかりません。<br><a href="./index.html">一覧に戻る</a></div>';return;}document.title=(x.name||x.code)+' | 株スコア';document.getElementById('head').innerHTML='<a class="back" href="./index.html">← 一覧に戻る</a><a class="navlink" href="./signals.html">🚦 サイン一覧</a><div class="detail-page-title">'+esc(x.name||x.code)+'</div>'+iconHtml(x)+'<div class="muted">'+esc(x.code)+'　'+(jp[x.regime]||esc(x.regime||''))+'　'+(sg[x.signal]||esc(x.signal||''))+'</div><div class="reason" style="margin-top:6px">'+esc(x.signal_reason||x.regime_reason||'')+'</div>';document.getElementById('content').innerHTML='<div class="card">'+oneLine(x)+'<div class="signalbox"><div class="section-title">🎯 買いサイン</div><div class="reason">'+esc(x.signal_reason||'')+'</div>'+(x.details?.condition_checks?.length?'<div class="checks" style="margin-top:7px">'+conditionRows(x.details.condition_checks)+'</div>':'')+'</div>'+details(x).replace('<details class="detail">','<details class="detail" open>')+'</div>';}
fetch('./data/decision_ranking.json?'+Date.now()).then(r=>{if(!r.ok)throw Error('日次ランキングがありません');return r.json()}).then(renderDetail).catch(e=>{document.getElementById('content').innerHTML='<div class="card error">'+esc(e.message)+'<br><a href="./index.html">一覧に戻る</a></div>';});if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js?ver=20260916').catch(()=>{});
